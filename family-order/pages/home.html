<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style id="theme-vars">
/* Family Order - Brand Design Tokens */
/* Primary palette: warm cream base with dual-mode accents (coffee brown + fresh green) */

:root {
  /* === Brand Primary: Warm Cream === */
  --color-primary-50: #FFF8F0;
  --color-primary-100: #FFEFD6;
  --color-primary-200: #FFE0B2;
  --color-primary-300: #FFCC80;
  --color-primary-400: #FFB74D;
  --color-primary-500: #FFA726;
  --color-primary-600: #FB8C00;
  --color-primary-700: #F57C00;
  --color-primary-800: #EF6C00;
  --color-primary-900: #E65100;

  /* === Coffee Mode Accent === */
  --coffee-50: #FDF8F0;
  --coffee-100: #F5E6D3;
  --coffee-200: #E8D0B3;
  --coffee-300: #D4A574;
  --coffee-400: #C4956A;
  --coffee-500: #8B6F47;
  --coffee-600: #6F4E37;
  --coffee-700: #5C4033;
  --coffee-800: #3E2723;
  --coffee-900: #2C1B14;

  /* === Food Mode Accent === */
  --food-50: #F0F9F4;
  --food-100: #DCFCE7;
  --food-200: #BBF7D0;
  --food-300: #86EFAC;
  --food-400: #4ADE80;
  --food-500: #22C55E;
  --food-600: #16A34A;
  --food-700: #15803D;
  --food-800: #166534;
  --food-900: #14532D;

  /* === Neutral Scale === */
  --color-neutral-50: #FAFAF9;
  --color-neutral-100: #F5F5F4;
  --color-neutral-200: #E7E5E4;
  --color-neutral-300: #D6D3D1;
  --color-neutral-400: #A8A29E;
  --color-neutral-500: #78716C;
  --color-neutral-600: #57534E;
  --color-neutral-700: #44403C;
  --color-neutral-800: #292524;
  --color-neutral-900: #1C1917;

  /* === State Colors === */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Semantic Aliases (light mode) === */
  --brand-background: #FFFBF5;
  --brand-foreground: #2C1B14;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2C1B14;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2C1B14;
  --brand-primary: #8B6F47;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F5F0EB;
  --brand-muted-foreground: #78716C;
  --brand-border: #E7E5E4;
  --brand-input: #E7E5E4;
  --brand-ring: #D4A574;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
  --brand-radius-full: 9999px;

  /* === Typography === */
  --font-sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 22px;
  --font-size-3xl: 28px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;
}

.dark {
  --brand-background: #1C1917;
  --brand-foreground: #FAFAF9;
  --brand-card: #292524;
  --brand-card-foreground: #FAFAF9;
  --brand-popover: #292524;
  --brand-popover-foreground: #FAFAF9;
  --brand-muted: #44403C;
  --brand-muted-foreground: #A8A29E;
  --brand-border: #44403C;
  --brand-input: #44403C;
}

/* === Tailwind semantic tokens === */
@theme inline {
  --color-background: var(--brand-background);
  --color-foreground: var(--brand-foreground);
  --color-card: var(--brand-card);
  --color-card-foreground: var(--brand-card-foreground);
  --color-popover: var(--brand-popover);
  --color-popover-foreground: var(--brand-popover-foreground);
  --color-primary: var(--brand-primary);
  --color-primary-foreground: var(--brand-primary-foreground);
  --color-muted: var(--brand-muted);
  --color-muted-foreground: var(--brand-muted-foreground);
  --color-border: var(--brand-border);
  --color-input: var(--brand-input);
  --color-ring: var(--brand-ring);
  --radius-small: var(--radius-sm);
  --radius-medium: var(--radius-md);
  --radius-large: var(--radius-lg);
  --radius-full: var(--radius-full);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--brand-background); }
      .text-background { color: var(--brand-background); }
      .border-background { border-color: var(--brand-background); }
      .ring-background { --tw-ring-color: var(--brand-background); }
      .bg-foreground { background-color: var(--brand-foreground); }
      .text-foreground { color: var(--brand-foreground); }
      .border-foreground { border-color: var(--brand-foreground); }
      .ring-foreground { --tw-ring-color: var(--brand-foreground); }
      .bg-card { background-color: var(--brand-card); }
      .text-card { color: var(--brand-card); }
      .border-card { border-color: var(--brand-card); }
      .ring-card { --tw-ring-color: var(--brand-card); }
      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--brand-card-foreground); }
      .bg-popover { background-color: var(--brand-popover); }
      .text-popover { color: var(--brand-popover); }
      .border-popover { border-color: var(--brand-popover); }
      .ring-popover { --tw-ring-color: var(--brand-popover); }
      .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
      .text-popover-foreground { color: var(--brand-popover-foreground); }
      .border-popover-foreground { border-color: var(--brand-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--brand-popover-foreground); }
      .bg-primary { background-color: var(--brand-primary); }
      .text-primary { color: var(--brand-primary); }
      .border-primary { border-color: var(--brand-primary); }
      .ring-primary { --tw-ring-color: var(--brand-primary); }
      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }
      .border-muted { border-color: var(--brand-muted); }
      .ring-muted { --tw-ring-color: var(--brand-muted); }
      .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
      .text-muted-foreground { color: var(--brand-muted-foreground); }
      .border-muted-foreground { border-color: var(--brand-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--brand-muted-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }
      .bg-ring { background-color: var(--brand-ring); }
      .text-ring { color: var(--brand-ring); }
      .border-ring { border-color: var(--brand-ring); }
      .ring-ring { --tw-ring-color: var(--brand-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <!-- Mobile app wrapper -->
      <div class="w-full max-w-[375px] mx-auto" style="background-color: #FFFBF5;">

        <!-- 1. Top Header Bar -->
        <header class="flex items-center justify-between px-5 pt-6 pb-3" style="background-color: #FFFBF5;">
          <span class="text-base font-semibold" style="color: #5C4033;">Hi~ 想吃点什么？</span>
          <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white" style="background: linear-gradient(135deg, var(--coffee-400), var(--coffee-500));">K</div>
        </header>

        <!-- 2. Hero Banner -->
        <section class="px-5 mt-2">
          <div class="relative rounded-2xl overflow-hidden h-[160px]">
            <img src="../assets/hero-banner.jpg" alt="hero banner" class="w-full h-full object-cover">
            <div class="absolute inset-0" style="background: linear-gradient(to top, rgba(44,27,20,0.55) 0%, rgba(44,27,20,0.15) 100%);"></div>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <p class="text-white text-lg font-semibold" style="text-shadow: 0 1px 6px rgba(0,0,0,0.3);">家庭小厨，美味随心点</p>
            </div>
          </div>
        </section>

        <!-- 3. Two Entry Cards -->
        <section class="flex gap-3 px-5 mt-5">
          <!-- Coffee Card -->
          <div data-dom-id="entry-coffee" class="flex-1 rounded-2xl p-5 flex flex-col items-center justify-center cursor-pointer shadow-sm" style="background: linear-gradient(160deg, var(--coffee-100), var(--coffee-200));">
            <span class="text-3xl mb-2">☕</span>
            <span class="text-sm font-semibold" style="color: var(--coffee-700);">来杯咖啡</span>
            <span class="text-xs mt-1" style="color: var(--coffee-400);">香浓醇厚</span>
          </div>
          <!-- Food Card -->
          <div data-dom-id="entry-food" class="flex-1 rounded-2xl p-5 flex flex-col items-center justify-center cursor-pointer shadow-sm" style="background: linear-gradient(160deg, var(--food-100), var(--food-200));">
            <span class="text-3xl mb-2">🍲</span>
            <span class="text-sm font-semibold" style="color: var(--food-700);">想吃美食</span>
            <span class="text-xs mt-1" style="color: var(--food-400);">家常美味</span>
          </div>
        </section>

        <!-- 4. Recent Orders Section -->
        <section class="px-5 mt-6">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-base font-semibold" style="color: var(--coffee-700);">最近点单</h2>
            <a href="#" class="text-xs" style="color: var(--coffee-500);">查看全部 &gt;</a>
          </div>

          <div class="flex flex-col gap-2.5">
            <!-- Order Card 1 -->
            <div class="flex items-center gap-3 rounded-xl p-3 shadow-sm" style="background-color: #FFFFFF;">
              <div class="w-11 h-11 rounded-lg flex-shrink-0 flex items-center justify-center text-lg" style="background-color: var(--coffee-100);">☕</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate" style="color: var(--coffee-800);">拿铁咖啡 x2</p>
                <p class="text-xs mt-0.5" style="color: var(--color-neutral-400);">今天 14:30</p>
              </div>
              <span class="text-xs font-medium px-2.5 py-1 rounded-full" style="background-color: var(--food-100); color: var(--food-600);">已完成</span>
            </div>
            <!-- Order Card 2 -->
            <div class="flex items-center gap-3 rounded-xl p-3 shadow-sm" style="background-color: #FFFFFF;">
              <div class="w-11 h-11 rounded-lg flex-shrink-0 flex items-center justify-center text-lg" style="background-color: var(--food-100);">🍜</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate" style="color: var(--coffee-800);">番茄鸡蛋面 x1</p>
                <p class="text-xs mt-0.5" style="color: var(--color-neutral-400);">今天 12:00</p>
              </div>
              <span class="text-xs font-medium px-2.5 py-1 rounded-full" style="background-color: var(--food-100); color: var(--food-600);">已完成</span>
            </div>
            <!-- Order Card 3 -->
            <div class="flex items-center gap-3 rounded-xl p-3 shadow-sm" style="background-color: #FFFFFF;">
              <div class="w-11 h-11 rounded-lg flex-shrink-0 flex items-center justify-center text-lg" style="background-color: var(--coffee-100);">🥐</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium truncate" style="color: var(--coffee-800);">牛角面包 x3</p>
                <p class="text-xs mt-0.5" style="color: var(--color-neutral-400);">昨天 09:15</p>
              </div>
              <span class="text-xs font-medium px-2.5 py-1 rounded-full" style="background-color: var(--food-100); color: var(--food-600);">已完成</span>
            </div>
          </div>
        </section>

        <!-- 5. Bottom Tab Bar -->
        <nav data-mobile-nav="global" class="flex items-center justify-around mt-8" style="height: 56px; background-color: #FFFBF5; border-top: 1px solid var(--brand-border);">
          <button class="flex flex-col items-center justify-center gap-0.5" data-active="true">
            <i data-lucide="home" class="w-5 h-5" style="color: var(--coffee-500);"></i>
            <span class="text-[10px] font-medium" style="color: var(--coffee-500);">首页</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-0.5" data-dom-id="tab-order">
            <i data-lucide="utensils-crossed" class="w-5 h-5" style="color: #A8A29E;"></i>
            <span class="text-[10px] font-medium" style="color: #A8A29E;">点单</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-0.5" data-dom-id="tab-history">
            <i data-lucide="clipboard-list" class="w-5 h-5" style="color: #A8A29E;"></i>
            <span class="text-[10px] font-medium" style="color: #A8A29E;">记录</span>
          </button>
        </nav>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
