<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交成功</title>
    <style id="theme-vars">
/* Family Order - Brand Design Tokens */
/* Primary palette: warm cream base with dual-mode accents (coffee brown + fresh green) */

:root {
  /* === Brand Primary: Warm Cream === */
  --color-primary-50: #FFF8F0;
  --color-primary-100: #FFEFD6;
  --color-primary-200: #FFE0B2;
  --color-primary-300: #FFCC80;
  --color-primary-400: #FFB74D;
  --color-primary-500: #FFA726;
  --color-primary-600: #FB8C00;
  --color-primary-700: #F57C00;
  --color-primary-800: #EF6C00;
  --color-primary-900: #E65100;

  /* === Coffee Mode Accent === */
  --coffee-50: #FDF8F0;
  --coffee-100: #F5E6D3;
  --coffee-200: #E8D0B3;
  --coffee-300: #D4A574;
  --coffee-400: #C4956A;
  --coffee-500: #8B6F47;
  --coffee-600: #6F4E37;
  --coffee-700: #5C4033;
  --coffee-800: #3E2723;
  --coffee-900: #2C1B14;

  /* === Food Mode Accent === */
  --food-50: #F0F9F4;
  --food-100: #DCFCE7;
  --food-200: #BBF7D0;
  --food-300: #86EFAC;
  --food-400: #4ADE80;
  --food-500: #22C55E;
  --food-600: #16A34A;
  --food-700: #15803D;
  --food-800: #166534;
  --food-900: #14532D;

  /* === Neutral Scale === */
  --color-neutral-50: #FAFAF9;
  --color-neutral-100: #F5F5F4;
  --color-neutral-200: #E7E5E4;
  --color-neutral-300: #D6D3D1;
  --color-neutral-400: #A8A29E;
  --color-neutral-500: #78716C;
  --color-neutral-600: #57534E;
  --color-neutral-700: #44403C;
  --color-neutral-800: #292524;
  --color-neutral-900: #1C1917;

  /* === State Colors === */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Semantic Aliases (light mode) === */
  --brand-background: #FFFBF5;
  --brand-foreground: #2C1B14;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2C1B14;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2C1B14;
  --brand-primary: #8B6F47;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F5F0EB;
  --brand-muted-foreground: #78716C;
  --brand-border: #E7E5E4;
  --brand-input: #E7E5E4;
  --brand-ring: #D4A574;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
  --brand-radius-full: 9999px;

  /* === Typography === */
  --font-sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 22px;
  --font-size-3xl: 28px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;
}

.dark {
  --brand-background: #1C1917;
  --brand-foreground: #FAFAF9;
  --brand-card: #292524;
  --brand-card-foreground: #FAFAF9;
  --brand-popover: #292524;
  --brand-popover-foreground: #FAFAF9;
  --brand-muted: #44403C;
  --brand-muted-foreground: #A8A29E;
  --brand-border: #44403C;
  --brand-input: #44403C;
}

/* === Tailwind semantic tokens === */
@theme inline {
  --color-background: var(--brand-background);
  --color-foreground: var(--brand-foreground);
  --color-card: var(--brand-card);
  --color-card-foreground: var(--brand-card-foreground);
  --color-popover: var(--brand-popover);
  --color-popover-foreground: var(--brand-popover-foreground);
  --color-primary: var(--brand-primary);
  --color-primary-foreground: var(--brand-primary-foreground);
  --color-muted: var(--brand-muted);
  --color-muted-foreground: var(--brand-muted-foreground);
  --color-border: var(--brand-border);
  --color-input: var(--brand-input);
  --color-ring: var(--brand-ring);
  --radius-small: var(--radius-sm);
  --radius-medium: var(--radius-md);
  --radius-large: var(--radius-lg);
  --radius-full: var(--radius-full);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="w-full max-w-[375px] mx-auto min-h-screen pb-24 px-5" style="background: var(--brand-background);">

        <!-- 1. Success Illustration -->
        <div class="flex justify-center pt-10 pb-6">
          <img
            src="../assets/order-success.jpg"
            alt="下单成功"
            class="w-[200px] h-[200px] rounded-full object-cover shadow-lg"
            style="box-shadow: 0 8px 30px rgba(111,78,55,0.15);"
          />
        </div>

        <!-- 2. Success Message -->
        <div class="flex flex-col items-center text-center pb-8">
          <!-- Green checkmark circle SVG -->
          <div class="mb-4">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="28" cy="28" r="28" fill="#22C55E"/>
              <path d="M16 28L24 36L40 20" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1 class="text-[26px] font-bold mb-2" style="color: var(--brand-foreground);">下单成功！</h1>
          <p class="text-[15px] mb-2" style="color: var(--brand-muted-foreground);">厨房已经收到你的点单啦~</p>
          <p class="text-[13px]" style="color: var(--coffee-400);">预计 15-20 分钟后可以享用</p>
        </div>

        <!-- 3. Order Summary Card -->
        <div class="mx-2 rounded-2xl p-5 mb-8" style="background: var(--brand-card); box-shadow: 0 2px 12px rgba(111,78,55,0.08);">
          <h2 class="text-[16px] font-semibold mb-4" style="color: var(--brand-foreground);">点单详情</h2>

          <!-- Order Items -->
          <div class="flex flex-col gap-3 mb-4">
            <div class="flex items-center justify-between">
              <span class="text-[14px]" style="color: var(--brand-card-foreground);">焦糖拿铁 x1</span>
              <span class="text-[14px] font-medium" style="color: var(--brand-foreground);">¥18</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-[14px]" style="color: var(--brand-card-foreground);">香草拿铁 x1</span>
              <span class="text-[14px] font-medium" style="color: var(--brand-foreground);">¥18</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-[14px]" style="color: var(--brand-card-foreground);">冰美式 x1</span>
              <span class="text-[14px] font-medium" style="color: var(--brand-foreground);">¥15</span>
            </div>
          </div>

          <!-- Divider -->
          <div class="w-full h-px mb-4" style="background: var(--brand-border);"></div>

          <!-- Total -->
          <div class="flex items-center justify-between mb-4">
            <span class="text-[15px] font-bold" style="color: var(--brand-foreground);">合计</span>
            <span class="text-[18px] font-bold" style="color: #6F4E37;">¥51</span>
          </div>

          <!-- Order Info -->
          <div class="flex flex-col gap-1">
            <p class="text-[12px]" style="color: var(--brand-muted-foreground);">下单时间: 2025-01-15 14:30</p>
            <p class="text-[12px]" style="color: var(--brand-muted-foreground);">点单人: 小明</p>
          </div>
        </div>

        <!-- 4. Action Buttons -->
        <div class="flex gap-3 px-2 mb-8">
          <button
            data-dom-id="back-home"
            class="flex-1 h-[44px] rounded-full text-[15px] font-semibold text-white transition-opacity hover:opacity-90 active:opacity-80"
            style="background: #6F4E37;"
          >
            返回首页
          </button>
          <button
            data-dom-id="view-history"
            class="flex-1 h-[44px] rounded-full text-[15px] font-semibold transition-opacity hover:opacity-90 active:opacity-80"
            style="border: 1.5px solid #6F4E37; color: #6F4E37; background: transparent;"
          >
            查看记录
          </button>
        </div>

      </div>

      <!-- 5. Bottom Tab Bar -->
      <nav data-mobile-nav="global" class="w-full max-w-[375px] mx-auto" style="background: var(--brand-card); border-top: 1px solid var(--brand-border);">
        <div class="flex items-center justify-around h-[52px]">
          <button data-dom-id="tab-home" data-active="true" class="flex flex-col items-center justify-center gap-0.5 py-1 w-16 transition-opacity" style="color: #6F4E37;">
            <i data-lucide="home" class="w-[22px] h-[22px]"></i>
            <span class="text-[10px] font-medium">首页</span>
          </button>
          <button data-dom-id="tab-order" class="flex flex-col items-center justify-center gap-0.5 py-1 w-16 transition-opacity" style="color: var(--brand-muted-foreground);">
            <i data-lucide="utensils-crossed" class="w-[22px] h-[22px]"></i>
            <span class="text-[10px] font-medium">点单</span>
          </button>
          <button data-dom-id="tab-history" class="flex flex-col items-center justify-center gap-0.5 py-1 w-16 transition-opacity" style="color: var(--brand-muted-foreground);">
            <i data-lucide="clipboard-list" class="w-[22px] h-[22px]"></i>
            <span class="text-[10px] font-medium">记录</span>
          </button>
        </div>
      </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
