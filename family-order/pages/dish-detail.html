<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜品详情</title>
    <style id="theme-vars">
/* Family Order - Brand Design Tokens */
/* Primary palette: warm cream base with dual-mode accents (coffee brown + fresh green) */

:root {
  /* === Brand Primary: Warm Cream === */
  --color-primary-50: #FFF8F0;
  --color-primary-100: #FFEFD6;
  --color-primary-200: #FFE0B2;
  --color-primary-300: #FFCC80;
  --color-primary-400: #FFB74D;
  --color-primary-500: #FFA726;
  --color-primary-600: #FB8C00;
  --color-primary-700: #F57C00;
  --color-primary-800: #EF6C00;
  --color-primary-900: #E65100;

  /* === Coffee Mode Accent === */
  --coffee-50: #FDF8F0;
  --coffee-100: #F5E6D3;
  --coffee-200: #E8D0B3;
  --coffee-300: #D4A574;
  --coffee-400: #C4956A;
  --coffee-500: #8B6F47;
  --coffee-600: #6F4E37;
  --coffee-700: #5C4033;
  --coffee-800: #3E2723;
  --coffee-900: #2C1B14;

  /* === Food Mode Accent === */
  --food-50: #F0F9F4;
  --food-100: #DCFCE7;
  --food-200: #BBF7D0;
  --food-300: #86EFAC;
  --food-400: #4ADE80;
  --food-500: #22C55E;
  --food-600: #16A34A;
  --food-700: #15803D;
  --food-800: #166534;
  --food-900: #14532D;

  /* === Neutral Scale === */
  --color-neutral-50: #FAFAF9;
  --color-neutral-100: #F5F5F4;
  --color-neutral-200: #E7E5E4;
  --color-neutral-300: #D6D3D1;
  --color-neutral-400: #A8A29E;
  --color-neutral-500: #78716C;
  --color-neutral-600: #57534E;
  --color-neutral-700: #44403C;
  --color-neutral-800: #292524;
  --color-neutral-900: #1C1917;

  /* === State Colors === */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Semantic Aliases (light mode) === */
  --brand-background: #FFFBF5;
  --brand-foreground: #2C1B14;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2C1B14;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2C1B14;
  --brand-primary: #8B6F47;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F5F0EB;
  --brand-muted-foreground: #78716C;
  --brand-border: #E7E5E4;
  --brand-input: #E7E5E4;
  --brand-ring: #D4A574;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
  --brand-radius-full: 9999px;

  /* === Typography === */
  --font-sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 22px;
  --font-size-3xl: 28px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;
}

.dark {
  --brand-background: #1C1917;
  --brand-foreground: #FAFAF9;
  --brand-card: #292524;
  --brand-card-foreground: #FAFAF9;
  --brand-popover: #292524;
  --brand-popover-foreground: #FAFAF9;
  --brand-muted: #44403C;
  --brand-muted-foreground: #A8A29E;
  --brand-border: #44403C;
  --brand-input: #44403C;
}

/* === Tailwind semantic tokens === */
@theme inline {
  --color-background: var(--brand-background);
  --color-foreground: var(--brand-foreground);
  --color-card: var(--brand-card);
  --color-card-foreground: var(--brand-card-foreground);
  --color-popover: var(--brand-popover);
  --color-popover-foreground: var(--brand-popover-foreground);
  --color-primary: var(--brand-primary);
  --color-primary-foreground: var(--brand-primary-foreground);
  --color-muted: var(--brand-muted);
  --color-muted-foreground: var(--brand-muted-foreground);
  --color-border: var(--brand-border);
  --color-input: var(--brand-input);
  --color-ring: var(--brand-ring);
  --radius-small: var(--radius-sm);
  --radius-medium: var(--radius-md);
  --radius-large: var(--radius-lg);
  --radius-full: var(--radius-full);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);

    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);

  }

      .bg-card-foreground { background-color: var(--brand-card-foreground); }
      .text-card-foreground { color: var(--brand-card-foreground); }
      .border-card-foreground { border-color: var(--brand-card-foreground); }

      .border-popover-foreground { border-color: var(--brand-popover-foreground); }

      .bg-primary { background-color: var(--brand-primary); }

      .border-primary { border-color: var(--brand-primary); }

      .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }
      .bg-muted { background-color: var(--brand-muted); }
      .text-muted { color: var(--brand-muted); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;

        mask-position: center;
        background-color: currentColor;

    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="w-full max-w-[375px] mx-auto bg-background min-h-screen pb-4">

        <!-- 1. Hero Image Section -->
        <div class="relative">
          <img src="../assets/coffee-detail.jpg" alt="焦糖拿铁" class="w-full h-[240px] object-cover rounded-b-3xl">
          <button data-dom-id="back-to-order" class="absolute top-4 left-4 w-9 h-9 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center shadow-md">
            <i data-lucide="arrow-left" class="w-5 h-5 text-coffee-800"></i>
          </button>
        </div>

        <!-- 2. Product Info Section -->
        <div class="px-5 pt-5 pb-3">
          <h1 class="text-[22px] font-bold text-foreground leading-tight">焦糖拿铁</h1>
          <div class="flex items-center gap-1 mt-2">
            <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
            <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
            <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
            <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
            <i data-lucide="star" class="w-4 h-4 text-amber-400 fill-amber-400"></i>
            <span class="text-sm font-medium text-foreground ml-1">4.9</span>
          </div>
          <p class="text-sm text-muted-foreground mt-3 leading-relaxed">精心调制的焦糖拿铁，选用优质阿拉比卡咖啡豆，搭配新鲜牛奶和手工焦糖酱，口感丝滑香甜，层次丰富。</p>
          <p class="text-2xl font-bold mt-3" style="color: #8B6F47;">¥18</p>
        </div>

        <!-- 3. Size Selection -->
        <div class="px-5 py-4">
          <h2 class="text-sm font-semibold text-foreground mb-3">选择规格</h2>
          <div class="flex gap-2 flex-wrap">
            <button class="px-4 py-2 rounded-full text-sm font-medium border-2 text-coffee-600 border-coffee-300 transition-colors">中杯 ¥15</button>
            <button class="px-4 py-2 rounded-full text-sm font-medium text-white transition-colors" style="background-color: #6F4E37; border: 2px solid #6F4E37;">大杯 ¥18</button>
            <button class="px-4 py-2 rounded-full text-sm font-medium border-2 text-coffee-600 border-coffee-300 transition-colors">超大杯 ¥22</button>
          </div>
        </div>

        <!-- 4. Temperature Toggle -->
        <div class="px-5 py-4">
          <h2 class="text-sm font-semibold text-foreground mb-3">温度</h2>
          <div class="flex gap-2">
            <button class="px-5 py-2 rounded-full text-sm font-medium text-white transition-colors" style="background-color: #6F4E37; border: 2px solid #6F4E37;">热饮</button>
            <button class="px-5 py-2 rounded-full text-sm font-medium border-2 text-coffee-600 border-coffee-300 transition-colors">冰饮</button>
          </div>
        </div>

        <!-- 5. Sweetness Selection -->
        <div class="px-5 py-4">
          <h2 class="text-sm font-semibold text-foreground mb-3">甜度</h2>
          <div class="flex gap-2 flex-wrap">
            <button class="px-3 py-1.5 rounded-full text-xs font-medium border-2 text-coffee-600 border-coffee-300 transition-colors">无糖</button>
            <button class="px-3 py-1.5 rounded-full text-xs font-medium text-white transition-colors" style="background-color: #6F4E37; border: 2px solid #6F4E37;">半糖</button>
            <button class="px-3 py-1.5 rounded-full text-xs font-medium border-2 text-coffee-600 border-coffee-300 transition-colors">标准糖</button>
            <button class="px-3 py-1.5 rounded-full text-xs font-medium border-2 text-coffee-600 border-coffee-300 transition-colors">加糖</button>
          </div>
        </div>

        <!-- 6. Add-ons Section -->
        <div class="px-5 py-4">
          <h2 class="text-sm font-semibold text-foreground mb-3">加料</h2>
          <div class="flex flex-col gap-3">
            <label class="flex items-center justify-between py-2 px-3 bg-muted/50 rounded-xl cursor-pointer">
              <div class="flex items-center gap-3">
                <div class="w-5 h-5 rounded-md border-2 border-coffee-300 flex items-center justify-center">
                  <i data-lucide="check" class="w-3.5 h-3.5 text-white hidden"></i>
                </div>
                <span class="text-sm text-foreground">加浓缩</span>
              </div>
              <span class="text-sm text-muted-foreground">+¥3</span>
            </label>
            <label class="flex items-center justify-between py-2 px-3 bg-muted/50 rounded-xl cursor-pointer">
              <div class="flex items-center gap-3">
                <div class="w-5 h-5 rounded-md border-2 border-coffee-300 flex items-center justify-center">
                  <i data-lucide="check" class="w-3.5 h-3.5 text-white hidden"></i>
                </div>
                <span class="text-sm text-foreground">加奶泡</span>
              </div>
              <span class="text-sm text-muted-foreground">+¥2</span>
            </label>
            <label class="flex items-center justify-between py-2 px-3 bg-muted/50 rounded-xl cursor-pointer">
              <div class="flex items-center gap-3">
                <div class="w-5 h-5 rounded-md border-2 border-coffee-300 flex items-center justify-center">
                  <i data-lucide="check" class="w-3.5 h-3.5 text-white hidden"></i>
                </div>
                <span class="text-sm text-foreground">加焦糖</span>
              </div>
              <span class="text-sm text-muted-foreground">+¥5</span>
            </label>
          </div>
        </div>

        <!-- 7. Quantity Selector + Add to Cart Bar -->
        <div class="mt-4 bg-white border-t border-border px-5 py-4 rounded-t-2xl">
          <div class="flex items-center justify-between">
            <!-- Quantity Selector -->
            <div class="flex items-center gap-3">
              <button class="w-8 h-8 rounded-full border-2 border-coffee-300 flex items-center justify-center text-coffee-600 font-bold text-lg">-</button>
              <span class="text-lg font-semibold text-foreground w-6 text-center">1</span>
              <button class="w-8 h-8 rounded-full border-2 border-coffee-300 flex items-center justify-center text-coffee-600 font-bold text-lg">+</button>
            </div>
            <!-- Add to Cart Button -->
            <button data-dom-id="add-to-cart" class="px-8 py-3 rounded-full text-white text-base font-semibold shadow-md" style="background-color: #6F4E37;">
              加入点单
            </button>
          </div>
        </div>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
