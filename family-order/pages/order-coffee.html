<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咖啡点单</title>
    <style id="theme-vars">
/* Family Order - Brand Design Tokens */
/* Primary palette: warm cream base with dual-mode accents (coffee brown + fresh green) */

:root {
  /* === Brand Primary: Warm Cream === */
  --color-primary-50: #FFF8F0;
  --color-primary-100: #FFEFD6;
  --color-primary-200: #FFE0B2;
  --color-primary-300: #FFCC80;
  --color-primary-400: #FFB74D;
  --color-primary-500: #FFA726;
  --color-primary-600: #FB8C00;
  --color-primary-700: #F57C00;
  --color-primary-800: #EF6C00;
  --color-primary-900: #E65100;

  /* === Coffee Mode Accent === */
  --coffee-50: #FDF8F0;
  --coffee-100: #F5E6D3;
  --coffee-200: #E8D0B3;
  --coffee-300: #D4A574;
  --coffee-400: #C4956A;
  --coffee-500: #8B6F47;
  --coffee-600: #6F4E37;
  --coffee-700: #5C4033;
  --coffee-800: #3E2723;
  --coffee-900: #2C1B14;

  /* === Food Mode Accent === */
  --food-50: #F0F9F4;
  --food-100: #DCFCE7;
  --food-200: #BBF7D0;
  --food-300: #86EFAC;
  --food-400: #4ADE80;
  --food-500: #22C55E;
  --food-600: #16A34A;
  --food-700: #15803D;
  --food-800: #166534;
  --food-900: #14532D;

  /* === Neutral Scale === */
  --color-neutral-50: #FAFAF9;
  --color-neutral-100: #F5F5F4;
  --color-neutral-200: #E7E5E4;
  --color-neutral-300: #D6D3D1;
  --color-neutral-400: #A8A29E;
  --color-neutral-500: #78716C;
  --color-neutral-600: #57534E;
  --color-neutral-700: #44403C;
  --color-neutral-800: #292524;
  --color-neutral-900: #1C1917;

  /* === State Colors === */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Semantic Aliases (light mode) === */
  --brand-background: #FFFBF5;
  --brand-foreground: #2C1B14;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2C1B14;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2C1B14;
  --brand-primary: #8B6F47;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F5F0EB;
  --brand-muted-foreground: #78716C;
  --brand-border: #E7E5E4;
  --brand-input: #E7E5E4;
  --brand-ring: #D4A574;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
  --brand-radius-full: 9999px;

  /* === Typography === */
  --font-sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 22px;
  --font-size-3xl: 28px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;
}

.dark {
  --brand-background: #1C1917;
  --brand-foreground: #FAFAF9;
  --brand-card: #292524;
  --brand-card-foreground: #FAFAF9;
  --brand-popover: #292524;
  --brand-popover-foreground: #FAFAF9;
  --brand-muted: #44403C;
  --brand-muted-foreground: #A8A29E;
  --brand-border: #44403C;
  --brand-input: #44403C;
}

/* === Tailwind semantic tokens === */
@theme inline {
  --color-background: var(--brand-background);
  --color-foreground: var(--brand-foreground);
  --color-card: var(--brand-card);
  --color-card-foreground: var(--brand-card-foreground);
  --color-popover: var(--brand-popover);
  --color-popover-foreground: var(--brand-popover-foreground);
  --color-primary: var(--brand-primary);
  --color-primary-foreground: var(--brand-primary-foreground);
  --color-muted: var(--brand-muted);
  --color-muted-foreground: var(--brand-muted-foreground);
  --color-border: var(--brand-border);
  --color-input: var(--brand-input);
  --color-ring: var(--brand-ring);
  --radius-small: var(--radius-sm);
  --radius-medium: var(--radius-md);
  --radius-large: var(--radius-lg);
  --radius-full: var(--radius-full);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {

      .text-card-foreground { color: var(--brand-card-foreground); }

      .text-primary-foreground { color: var(--brand-primary-foreground); }
      .border-primary-foreground { border-color: var(--brand-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--brand-primary-foreground); }

      .text-muted { color: var(--brand-muted); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;

        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="w-full max-w-[375px] mx-auto bg-[#FFFBF5] min-h-screen flex flex-col pb-0">

      <!-- Page Header -->
      <header class="flex items-center justify-between px-4 py-3 bg-[#FFFBF5]">
        <button data-dom-id="back-home" class="w-9 h-9 flex items-center justify-center rounded-full bg-[#F5E6D3]">
          <i data-lucide="arrow-left" class="w-5 h-5 text-[#6F4E37]"></i>
        </button>
        <h1 class="text-lg font-bold text-[#6F4E37]">咖啡点单</h1>
        <button class="relative w-9 h-9 flex items-center justify-center rounded-full bg-[#F5E6D3]">
          <i data-lucide="shopping-cart" class="w-5 h-5 text-[#6F4E37]"></i>
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-[#6F4E37] text-white text-[10px] font-bold rounded-full flex items-center justify-center">2</span>
        </button>
      </header>

      <!-- Left Sidebar + Right Content Layout -->
      <div class="flex flex-1">

        <!-- Left Sidebar: Category Navigation -->
        <div class="w-20 bg-[#F5E6D3] flex flex-col shrink-0">
          <span class="py-3 text-center text-xs font-semibold bg-white border-l-2 border-[#6F4E37] text-[#3E2723]">推荐</span>
          <span class="py-3 text-center text-xs text-[#78716C]">美式</span>
          <span class="py-3 text-center text-xs text-[#78716C]">拿铁</span>
          <span class="py-3 text-center text-xs text-[#78716C]">特调</span>
          <span class="py-3 text-center text-xs text-[#78716C]">摩卡</span>
          <span class="py-3 text-center text-xs text-[#78716C]">茶饮</span>
          <span class="py-3 text-center text-xs text-[#78716C]">其他</span>
        </div>

        <!-- Right Content: Product List -->
        <div class="flex-1 bg-white px-3 py-3 overflow-y-auto">

          <p class="text-sm font-bold text-[#3E2723] mb-3">推荐</p>

          <div class="flex flex-col gap-3">

            <!-- Product 1: 焦糖拿铁 -->
            <div data-dom-id="product-coffee-1" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#F5E6D3]">
              <div class="bg-[#F5E6D3] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">☕</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-[#3E2723]">焦糖拿铁</p>
                <p class="text-xs text-[#8B6F47] mt-0.5">香浓焦糖搭配丝滑牛奶</p>
                <p class="text-sm font-bold text-[#8B6F47] mt-1">¥15</p>
              </div>
              <button class="w-8 h-8 rounded-full bg-[#6F4E37] text-white flex items-center justify-center shrink-0 text-lg font-light">+</button>
            </div>

            <!-- Product 2: 冰美式 -->
            <div data-dom-id="product-coffee-2" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#F5E6D3]">
              <div class="bg-[#F5E6D3] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">🥤</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-[#3E2723]">冰美式</p>
                <p class="text-xs text-[#8B6F47] mt-0.5">经典意式浓缩</p>
                <p class="text-sm font-bold text-[#8B6F47] mt-1">¥15</p>
              </div>
              <button class="w-8 h-8 rounded-full bg-[#6F4E37] text-white flex items-center justify-center shrink-0 text-lg font-light">+</button>
            </div>

            <!-- Product 3: 香草拿铁 -->
            <div data-dom-id="product-coffee-3" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#F5E6D3]">
              <div class="bg-[#F5E6D3] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">☕</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-[#3E2723]">香草拿铁</p>
                <p class="text-xs text-[#8B6F47] mt-0.5">清新香草风味</p>
                <p class="text-sm font-bold text-[#8B6F47] mt-1">¥18</p>
              </div>
              <button class="w-8 h-8 rounded-full bg-[#6F4E37] text-white flex items-center justify-center shrink-0 text-lg font-light">+</button>
            </div>

            <!-- Product 4: 摩卡咖啡 -->
            <div data-dom-id="product-coffee-4" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#F5E6D3]">
              <div class="bg-[#F5E6D3] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">☕</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-[#3E2723]">摩卡咖啡</p>
                <p class="text-xs text-[#8B6F47] mt-0.5">浓郁巧克力</p>
                <p class="text-sm font-bold text-[#8B6F47] mt-1">¥20</p>
              </div>
              <button class="w-8 h-8 rounded-full bg-[#6F4E37] text-white flex items-center justify-center shrink-0 text-lg font-light">+</button>
            </div>

            <!-- Product 5: 抹茶拿铁 -->
            <div data-dom-id="product-coffee-5" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#F5E6D3]">
              <div class="bg-[#F5E6D3] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">🍵</div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-bold text-[#3E2723]">抹茶拿铁</p>
                <p class="text-xs text-[#8B6F47] mt-0.5">日式抹茶</p>
                <p class="text-sm font-bold text-[#8B6F47] mt-1">¥18</p>
              </div>
              <button class="w-8 h-8 rounded-full bg-[#6F4E37] text-white flex items-center justify-center shrink-0 text-lg font-light">+</button>
            </div>

          </div>

        </div>

      </div>

      <!-- Bottom Cart Bar -->
      <div class="flex items-center justify-between px-4 py-3 mt-3 bg-white border-t border-[#F5E6D3] shadow-sm rounded-t-xl">
        <div class="flex items-center gap-2">
          <div class="relative">
            <i data-lucide="shopping-bag" class="w-5 h-5 text-[#6F4E37]"></i>
            <span class="absolute -top-1.5 -right-2 bg-[#6F4E37] text-white text-[10px] font-bold rounded-full px-1.5 leading-[14px]">3 件</span>
          </div>
        </div>
        <span class="text-sm font-bold text-[#3E2723]">合计 ¥45</span>
        <button data-dom-id="submit-order-coffee" class="px-5 py-2 rounded-full bg-[#6F4E37] text-white text-sm font-medium">去下单</button>
      </div>

      <!-- Bottom Tab Bar -->
      <nav class="flex items-center justify-around bg-white border-t border-[#F5E6D3]" style="height: 56px;" data-mobile-nav="global">
        <button data-dom-id="tab-home" class="flex flex-col items-center justify-center gap-0.5 text-[#78716C]">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-[10px]">首页</span>
        </button>
        <button data-active="true" class="flex flex-col items-center justify-center gap-0.5 text-[#8B6F47]">
          <i data-lucide="utensils-crossed" class="w-5 h-5"></i>
          <span class="text-[10px] font-medium">点单</span>
        </button>
        <button data-dom-id="tab-history" class="flex flex-col items-center justify-center gap-0.5 text-[#78716C]">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          <span class="text-[10px]">记录</span>
        </button>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
