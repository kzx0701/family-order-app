<!DOCTYPE html>

    <style id="theme-vars">
/* Family Order - Brand Design Tokens */
/* Primary palette: warm cream base with dual-mode accents (coffee brown + fresh green) */

:root {
  /* === Brand Primary: Warm Cream === */
  --color-primary-50: #FFF8F0;
  --color-primary-100: #FFEFD6;
  --color-primary-200: #FFE0B2;
  --color-primary-300: #FFCC80;
  --color-primary-400: #FFB74D;

  --color-primary-600: #FB8C00;
  --color-primary-700: #F57C00;
  --color-primary-800: #EF6C00;
  --color-primary-900: #E65100;

  /* === Coffee Mode Accent === */
  --coffee-50: #FDF8F0;
  --coffee-100: #F5E6D3;
  --coffee-200: #E8D0B3;
  --coffee-300: #D4A574;
  --coffee-400: #C4956A;
  --coffee-500: #8B6F47;
  --coffee-600: #6F4E37;
  --coffee-700: #5C4033;
  --coffee-800: #3E2723;
  --coffee-900: #2C1B14;

  /* === Food Mode Accent === */
  --food-50: #F0F9F4;
  --food-100: #DCFCE7;
  --food-200: #BBF7D0;
  --food-300: #86EFAC;
  --food-400: #4ADE80;
  --food-500: #22C55E;
  --food-600: #16A34A;
  --food-700: #15803D;
  --food-800: #166534;
  --food-900: #14532D;

  /* === Neutral Scale === */
  --color-neutral-50: #FAFAF9;
  --color-neutral-100: #F5F5F4;
  --color-neutral-200: #E7E5E4;
  --color-neutral-300: #D6D3D1;
  --color-neutral-400: #A8A29E;
  --color-neutral-500: #78716C;
  --color-neutral-600: #57534E;
  --color-neutral-700: #44403C;
  --color-neutral-800: #292524;
  --color-neutral-900: #1C1917;

  /* === State Colors === */
  --state-success: #22C55E;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  /* === Semantic Aliases (light mode) === */
  --brand-background: #FFFBF5;
  --brand-foreground: #2C1B14;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #2C1B14;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #2C1B14;
  --brand-primary: #8B6F47;
  --brand-primary-foreground: #FFFFFF;
  --brand-muted: #F5F0EB;
  --brand-muted-foreground: #78716C;
  --brand-border: #E7E5E4;
  --brand-input: #E7E5E4;
  --brand-ring: #D4A574;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
  --brand-radius-full: 9999px;

  /* === Typography === */
  --font-sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 22px;
  --font-size-3xl: 28px;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --line-height-tight: 1.25;
  --line-height-normal: 1.5;
  --line-height-relaxed: 1.75;
}

.dark {
  --brand-background: #1C1917;
  --brand-foreground: #FAFAF9;
  --brand-card: #292524;
  --brand-card-foreground: #FAFAF9;
  --brand-popover: #292524;
  --brand-popover-foreground: #FAFAF9;
  --brand-muted: #44403C;
  --brand-muted-foreground: #A8A29E;
  --brand-border: #44403C;
  --brand-input: #44403C;
}

/* === Tailwind semantic tokens === */
@theme inline {
  --color-background: var(--brand-background);
  --color-foreground: var(--brand-foreground);
  --color-card: var(--brand-card);
  --color-card-foreground: var(--brand-card-foreground);
  --color-popover: var(--brand-popover);
  --color-popover-foreground: var(--brand-popover-foreground);
  --color-primary: var(--brand-primary);
  --color-primary-foreground: var(--brand-primary-foreground);
  --color-muted: var(--brand-muted);
  --color-muted-foreground: var(--brand-muted-foreground);
  --color-border: var(--brand-border);
  --color-input: var(--brand-input);
  --color-ring: var(--brand-ring);
  --radius-small: var(--radius-sm);
  --radius-medium: var(--radius-md);
  --radius-large: var(--radius-lg);
  --radius-full: var(--radius-full);
}

    </style>

<body class="min-h-screen font-sans antialiased">
    <main>
      <div class="w-full max-w-[375px] mx-auto bg-[#FFFBF5] min-h-screen flex flex-col">

        <!-- Page Header -->
        <div class="flex items-center justify-between px-4 py-3 bg-[#FFFBF5]">
          <button data-dom-id="back-home" class="w-9 h-9 rounded-full bg-[#F0F9F4] flex items-center justify-center">
            <i data-lucide="arrow-left" class="w-5 h-5 text-[#15803D]"></i>
          </button>
          <h1 class="text-lg font-bold text-[#15803D]">美食点单</h1>
          <button class="w-9 h-9 rounded-full bg-[#F0F9F4] flex items-center justify-center relative">
            <i data-lucide="shopping-cart" class="w-5 h-5 text-[#15803D]"></i>
            <span class="absolute -top-1 -right-1 w-4 h-4 bg-[#16A34A] rounded-full text-white text-[10px] font-bold flex items-center justify-center">1</span>
          </button>
        </div>

        <!-- Left Sidebar + Right Content Two-Column Layout -->
        <div class="flex flex-1 overflow-hidden">

          <!-- Left Sidebar: Category Navigation -->
          <div class="w-20 bg-[#F0F9F4] flex flex-col shrink-0 overflow-y-auto no-scrollbar">
            <div class="bg-white font-semibold text-[#15803D] border-l-2 border-[#16A34A] py-3 text-center text-xs">推荐</div>
            <div class="text-[#78716C] py-3 text-center text-xs">主食</div>
            <div class="text-[#78716C] py-3 text-center text-xs">小炒</div>
            <div class="text-[#78716C] py-3 text-center text-xs">汤品</div>
            <div class="text-[#78716C] py-3 text-center text-xs">甜品</div>
            <div class="text-[#78716C] py-3 text-center text-xs">饮品</div>
            <div class="text-[#78716C] py-3 text-center text-xs">其他</div>
          </div>

          <!-- Right Content: Product List -->
          <div class="flex-1 bg-white px-3 py-3 overflow-y-auto">
            <p class="text-sm font-bold text-[#15803D] mb-3">推荐</p>

            <div class="flex flex-col gap-3">
              <!-- Product 1 -->
              <div data-dom-id="product-food-1" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#E7E5E4]">
                <div class="bg-[#F0F9F4] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">🍝</div>
                <div class="flex-1 min-w-0">
                  <p class="font-bold text-[#15803D] text-sm">番茄意面</p>
                  <p class="text-xs text-[#78716C] mt-0.5">新鲜番茄手工面</p>
                  <p class="text-sm font-semibold text-[#16A34A] mt-1">¥22</p>
                </div>
                <button class="w-7 h-7 rounded-full bg-[#16A34A] flex items-center justify-center shrink-0">
                  <i data-lucide="plus" class="w-4 h-4 text-white"></i>
                </button>
              </div>

              <!-- Product 2 -->
              <div data-dom-id="product-food-2" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#E7E5E4]">
                <div class="bg-[#F0F9F4] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">🍲</div>
                <div class="flex-1 min-w-0">
                  <p class="font-bold text-[#15803D] text-sm">土豆炖牛腩</p>
                  <p class="text-xs text-[#78716C] mt-0.5">慢炖软烂入味</p>
                  <p class="text-sm font-semibold text-[#16A34A] mt-1">¥28</p>
                </div>
                <button class="w-7 h-7 rounded-full bg-[#16A34A] flex items-center justify-center shrink-0">
                  <i data-lucide="plus" class="w-4 h-4 text-white"></i>
                </button>
              </div>

              <!-- Product 3 -->
              <div data-dom-id="product-food-3" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#E7E5E4]">
                <div class="bg-[#F0F9F4] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">🥘</div>
                <div class="flex-1 min-w-0">
                  <p class="font-bold text-[#15803D] text-sm">宫保鸡丁</p>
                  <p class="text-xs text-[#78716C] mt-0.5">经典川味家常</p>
                  <p class="text-sm font-semibold text-[#16A34A] mt-1">¥18</p>
                </div>
                <button class="w-7 h-7 rounded-full bg-[#16A34A] flex items-center justify-center shrink-0">
                  <i data-lucide="plus" class="w-4 h-4 text-white"></i>
                </button>
              </div>

              <!-- Product 4 -->
              <div data-dom-id="product-food-4" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#E7E5E4]">
                <div class="bg-[#F0F9F4] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">🥗</div>
                <div class="flex-1 min-w-0">
                  <p class="font-bold text-[#15803D] text-sm">蔬菜沙拉</p>
                  <p class="text-xs text-[#78716C] mt-0.5">有机蔬菜鲜拌</p>
                  <p class="text-sm font-semibold text-[#16A34A] mt-1">¥15</p>
                </div>
                <button class="w-7 h-7 rounded-full bg-[#16A34A] flex items-center justify-center shrink-0">
                  <i data-lucide="plus" class="w-4 h-4 text-white"></i>
                </button>
              </div>

              <!-- Product 5 -->
              <div data-dom-id="product-food-5" class="flex items-center gap-3 bg-white rounded-xl p-3 border border-[#E7E5E4]">
                <div class="bg-[#F0F9F4] rounded-xl w-16 h-16 flex items-center justify-center text-2xl shrink-0">🍰</div>
                <div class="flex-1 min-w-0">
                  <p class="font-bold text-[#15803D] text-sm">提拉米苏</p>
                  <p class="text-xs text-[#78716C] mt-0.5">经典意式甜点</p>
                  <p class="text-sm font-semibold text-[#16A34A] mt-1">¥16</p>
                </div>
                <button class="w-7 h-7 rounded-full bg-[#16A34A] flex items-center justify-center shrink-0">
                  <i data-lucide="plus" class="w-4 h-4 text-white"></i>
                </button>
              </div>
            </div>

          </div>

        </div>

        <!-- Bottom Cart Bar -->
        <div class="flex items-center justify-between px-4 py-3 bg-white border-t border-[#E7E5E4] shadow-sm">
          <div class="flex items-center gap-2">
            <div class="relative">
              <i data-lucide="shopping-cart" class="w-5 h-5 text-[#15803D]"></i>
              <span class="absolute -top-2 -right-2 bg-[#16A34A] text-white text-[10px] font-bold rounded-full px-1.5 py-0.5 leading-none">2 件</span>
            </div>
          </div>
          <p class="text-sm font-semibold text-[#15803D]">合计 ¥43</p>
          <button data-dom-id="submit-order-food" class="px-5 py-2 bg-[#16A34A] text-white text-sm font-semibold rounded-full">去下单</button>
        </div>

        <!-- Bottom Tab Bar -->
        <nav data-mobile-nav="global" class="flex items-center justify-around bg-white border-t border-[#E7E5E4]" style="height:56px">
          <button data-dom-id="tab-home" class="flex flex-col items-center gap-0.5">
            <i data-lucide="home" class="w-5 h-5 text-[#A8A29E]"></i>
            <span class="text-[10px] text-[#A8A29E]">首页</span>
          </button>
          <button data-active="true" class="flex flex-col items-center gap-0.5">
            <i data-lucide="utensils-crossed" class="w-5 h-5 text-[#16A34A]"></i>
            <span class="text-[10px] text-[#16A34A] font-semibold">点单</span>
          </button>
          <button data-dom-id="tab-history" class="flex flex-col items-center gap-0.5">
            <i data-lucide="clipboard-list" class="w-5 h-5 text-[#A8A29E]"></i>
            <span class="text-[10px] text-[#A8A29E]">记录</span>
          </button>
        </nav>

      </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
