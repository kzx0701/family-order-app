<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭小食谱 · 详情与编辑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaece2;color:#624735;font-family:-apple-system,"PingFang SC",sans-serif}.layout{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}.intro{max-width:280px}.kicker{font-size:12px;color:#788568}.heading{font-size:34px;line-height:1.6;margin:20px 0}.copy{font-size:14px;line-height:2;color:#8c725e}.roles{display:flex;gap:10px;margin:28px 0}.role{cursor:pointer;border:1px solid #b8bea4;color:#624735;border-radius:12px;padding:12px 18px;background:#fff9ed;font-size:14px}.role.active{background:#dbe8c8;border-color:#765540}.note{font-size:12px;color:#8c725e;line-height:1.9}.phone{width:390px;height:min(844px,calc(100vh - 48px));border:1px solid #c6beaa;border-radius:28px;overflow:hidden;background:#fff9ed;box-shadow:0 18px 60px #464b3018;flex-shrink:0}.frame{border:0;width:100%;height:100%;display:block}
@media(max-width:760px){.layout{padding:12px;gap:0}.intro{display:none}.phone{height:calc(100dvh - 24px);max-width:100%}}@media(max-width:430px){.layout{padding:0}.phone{height:100dvh;width:100%;border:0;border-radius:0}}
</style></head>
<body><main class="layout"><aside class="intro"><div class="kicker">家庭小食谱 · 可交互预览</div><div class="heading">把家的味道，<br>一点点记下来。</div><div class="copy">食材、调料，还有每一个小步骤。<br>阅读和编辑，都在同一页。</div><div class="roles"><button class="role active" data-role="cook">饲养员</button><button class="role" data-role="diner">干饭人</button></div><div class="note">饲养员可点击底部「编辑菜谱」。<br>干饭人只有只读详情。<br>示例为蒜蓉小青菜，保存仅写入本机。<br>切换预览身份会重新加载，未保存内容不会保留。</div></aside><section class="phone"><iframe class="frame" title="菜谱详情编辑预览" src="/?previewRole=cook#/pages/recipe-detail/recipe-detail?id=garlic-greens"></iframe></section></main>
<script>document.querySelectorAll('[data-role]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-role]').forEach(item=>item.classList.toggle('active',item===button));document.querySelector('.frame').src='/?previewRole='+button.dataset.role+'#/pages/recipe-detail/recipe-detail?id=garlic-greens'}));</script></body></html>
