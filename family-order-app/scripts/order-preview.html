<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家里的手绘菜单 · 点单预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ebdf;color:#624735;font-family:-apple-system,"PingFang SC",sans-serif}.layout{min-height:100vh;display:flex;justify-content:center;align-items:center;gap:72px;padding:24px}.intro{width:292px}.tag{display:inline-block;font-size:12px;background:#fff9ed;padding:9px 14px;border:1px solid #c7cbb7;border-radius:15px}.heading{font-size:36px;line-height:1.65;font-weight:600;margin:24px 0 15px}.copy{font-size:14px;line-height:2;color:#8c725e}.line{width:36px;height:3px;background:#e97a69;transform:rotate(-6deg);margin:24px 0}.sizes{display:flex;gap:10px;margin:28px 0 16px}.size{cursor:pointer;background:#fff9ed;color:#624735;border:1px solid #bfc5ac;padding:10px 16px;border-radius:12px;font-size:13px}.size.active{background:#dbe8c8;border-color:#765540}.note{font-size:12px;color:#8c725e;line-height:1.9}.phone{width:390px;height:min(844px,calc(100vh - 48px));min-height:560px;border:1px solid #c4bba5;background:#fff9ed;border-radius:28px;overflow:hidden;box-shadow:0 18px 60px #464b3015;flex-shrink:0;transition:width 220ms ease}.frame{display:block;width:100%;height:100%;border:0}@media(max-width:800px){.intro{display:none}.layout{padding:12px}.phone{height:calc(100dvh - 24px);min-height:0}}@media(max-width:480px){.layout{padding:0}.phone{width:100%!important;height:100dvh;border:0;border-radius:0}}
</style></head><body><main class="layout"><aside class="intro"><div class="tag">菜单设计 · 可交互预览</div><div class="heading">你负责好好吃，<br>我负责用心做。</div><div class="line"></div><div class="copy">一份拿手好菜，一杯喜欢的咖啡。<br>把日常的小快乐，写进点单清单。</div><div class="sizes"><button class="size" data-width="360">360</button><button class="size active" data-width="390">390</button><button class="size" data-width="430">430</button></div><div class="note">试试切换菜品与咖啡、选口味、加减购。<br>两份购物车独立保留，支持完整模拟点单。<br>使用 mock 数据，不会向家人发送订单。</div></aside><section class="phone"><iframe class="frame" src="/#/pages/order/order?type=food" title="手绘点单界面"></iframe></section></main><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.phone').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(item=>item.classList.toggle('active',item===button))}));</script></body></html>
