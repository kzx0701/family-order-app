<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭小食谱 · 交互预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaece2;color:#624735;font-family:-apple-system,"PingFang SC",sans-serif}.preview{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:76px;padding:28px}.intro{max-width:285px}.eyebrow{font-size:11px;letter-spacing:3px;color:#817a64}.line{width:34px;height:3px;background:#e97a69;margin:25px 0;transform:rotate(-5deg)}h1{font-size:38px;line-height:1.45;letter-spacing:2px;font-weight:650;margin:0}p{font-size:14px;line-height:2;color:#8c725e;margin:20px 0}.label{display:inline-flex;align-items:center;gap:8px;background:#fff9ed;border:1px solid #c9cbb6;border-radius:20px;padding:8px 13px;font-size:11px}.dot{width:6px;height:6px;background:#85a96f;border-radius:50%}.sizes{display:flex;gap:8px;margin-top:28px}button{background:transparent;border:1px solid #c4c6b3;border-radius:9px;padding:9px 12px;color:#70644f;cursor:pointer}button.active{background:#fff9ed;border-color:#8c725e}small{display:block;font-size:11px;color:#8c8775;margin-top:14px;line-height:1.8}.device{width:390px;height:min(844px,calc(100vh - 56px));min-height:540px;overflow:hidden;border:1px solid #c6beaa;border-radius:30px;background:#fff9ed;box-shadow:0 18px 60px #464b3020;transition:width 220ms ease}iframe{display:block;border:0;width:100%;height:100%;background:#fff9ed}@media(max-width:780px){.intro{display:none}.preview{padding:16px}.device{height:calc(100dvh - 32px);min-height:0}}@media(max-width:480px){.preview{padding:0}.device{width:100%!important;height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){.device{transition:none}}
</style>
</head>
<body><main class="preview"><aside class="intro"><span class="label"><span class="dot"></span>可交互预览 · 二期菜谱</span><div class="line"></div><div class="eyebrow">OUR LITTLE COOKBOOK</div><h1>把家的味道<br>记进小食谱。</h1><p>翻翻分类，找到想做的那道菜。<br>备好食材，再一起慢慢做。</p><div class="sizes" aria-label="切换手机预览宽度"><button data-width="360">360</button><button data-width="390" class="active">390</button><button data-width="430">430</button></div><small>点击菜品，体验口味切换、份量调整与逐步制作。<br>当前使用示例数据，不会修改家庭内容。</small></aside><section class="device"><iframe src="/#/pages/recipe/recipe" title="家庭菜谱手机预览"></iframe></section></main><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('.device').style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(item=>item.classList.toggle('active',item===button))}));</script></body>
</html>
